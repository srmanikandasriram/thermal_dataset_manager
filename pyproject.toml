[project]
name = "thermal-dataset-manager"
version = "0.1.0"
description = "Lightweight browser-based app to organize, browse, and manage raw thermal video captures"
readme = "README.md"
requires-python = ">=3.10"
# Core: just what `thermal_dataset_manager.loader` needs to query and load
# videos, so other projects can depend on it without the server/ingest stack.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlmodel>=0.0.22",
    "zarr>=2.18,<3.0",
    "numcodecs>=0.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Reading source captures, writing datasets, thumbnails (ingest_cli.py).
ingest = [
    "h5py>=3.11",
    "zstandard>=0.23",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "scikit-image>=0.24",
    "python-ulid>=2.7",
]
# The web API behind the frontend (it also recomputes metadata, so needs ingest).
server = [
    "thermal-dataset-manager[ingest]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]
dev = [
    "thermal-dataset-manager[server]",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.ruff.lint]
# B008: `Depends(...)` in argument defaults is the standard FastAPI idiom.
ignore = ["B008"]
